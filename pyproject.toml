[project]
name = "evaluation-cleanup"
version = "0.1.0"
description = "Evaluationen sicher finden und nach Bestätigung bereinigen"
readme = "README.md"
authors = [
    { name = "convertedfox", email = "nicolaibatke@googlemail.com" }
]
requires-python = ">=3.12"
dependencies = ["flet==0.85.3"]

[dependency-groups]
dev = ["flet-cli==0.85.3", "flet-desktop==0.85.3", "mypy>=1.15", "pytest>=8.3", "ruff>=0.11"]

[project.scripts]
evaluation-cleanup = "evaluation_cleanup:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.flet]
project = "evaluation_cleanup"
product = "Evaluationen-bereinigen"

[tool.flet.app]
path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
